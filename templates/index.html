<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>VIP Tahmin</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:#fff;
  text-align:center;
}
.card {
  background:#1e293b;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
.loading { color:yellow; }
</style>
</head>

<body>

<h1>VIP Tahmin Sistemi</h1>

<div id="matches"></div>

<script>
let allMatches = [];
let currentDate = new Date().toISOString().split("T")[0];

function renderAll() {
  const container = document.getElementById("matches");
  container.innerHTML = "";

  allMatches.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "card";

    if (m.loading) {
      div.innerHTML = `
        <div>${m.home_name} vs ${m.away_name}</div>
        <div class="loading">Yükleniyor...</div>
      `;
    } else if (m.analysis) {
      div.innerHTML = `
        <div><b>${m.home_name} vs ${m.away_name}</b></div>
        <div>1: %${m.analysis.home_win}</div>
        <div>X: %${m.analysis.draw}</div>
        <div>2: %${m.analysis.away_win}</div>
        <div>Genel Rating: ${m.analysis.g_rating}</div>
        <div>İD Rating: ${m.analysis.id_rating}</div>
      `;
    } else {
      div.innerHTML = `<div>${m.home_name} vs ${m.away_name}</div><div>Hata</div>`;
    }

    container.appendChild(div);
  });
}

function updateCard(i) {
  renderAll();
}

function updateStats() {}

async function loadFixtures() {

  const res  = await fetch(`/api/fixtures?date=${currentDate}`);
  const data = await res.json();

  allMatches = data.matches.map(m => ({
    ...m,
    analysis: null,
    loading: true
  }));

  renderAll();

  // ✅ SADECE BURASI DEĞİŞTİ (Railway fix)
  const limit = 5;

  for (let i = 0; i < allMatches.length; i += limit) {
    const batch = allMatches.slice(i, i + limit);

    await Promise.allSettled(
      batch.map((m, j) => {
        const idx = i + j;
        const lk = m.league_key ? `?lk=${m.league_key}` : '';

        return fetch(`/api/analyze/${m.home_id}/${m.away_id}${lk}`)
          .then(r => r.json())
          .then(d => {
            allMatches[idx].analysis = d.analysis || null;
            allMatches[idx].loading  = false;
            updateCard(idx);
            updateStats();
          })
          .catch(() => {
            allMatches[idx].loading = false;
            updateCard(idx);
          });
      })
    );
  }
}

loadFixtures();
</script>

</body>
</html>
